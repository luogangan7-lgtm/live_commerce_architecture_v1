# File: deploy/postgres/pg_hba.conf
# Purpose: client authentication policy (deploy-design §9.2). First matching line wins.
# Runs as/in: service "postgres", passed as `-c hba_file=/etc/postgresql/pg_hba.conf` (read-only
#   bind mount). Also applies to the image's init-time socket server (scram works there because
#   the entrypoint exports PGPASSWORD during initdb).
# Reads env / secrets: none. Passwords are SCRAM verifiers created by initdb (superuser) and by
#   deploy/postgres/provision-logins.sh (service logins).
# Used by: every client — migrate/provision-logins/pg-ops (unix socket, superuser), api and
#   workers (TCP over the internal "backend" network, one LOGIN per DSN).
# Depends on: database name fixed to `live_commerce` (pg_hba cannot interpolate variables).
# Status: DESIGN; verified by smoke S13 (logins authenticate) and S14 (superuser over TCP rejected).
# Change rules: the superuser must never be reachable over TCP. `samenet` trusts every container
#   on the backend network (risk R8) — only services listed in compose.yml may join it.
#   Two-host variant (NOT_RUN): enable the hostssl line with the app host's private IP.

# TYPE  DATABASE       USER       ADDRESS     METHOD
local   all            postgres               scram-sha-256   # migrate / provision / pg-ops via pgsocket volume
local   replication    postgres               scram-sha-256   # pg_basebackup from pg-ops
local   all            all                    reject
host    all            postgres   all         reject          # superuser never over TCP
host    replication    all        all         reject
host    live_commerce  all        samenet     scram-sha-256   # service logins from compose networks
# hostssl live_commerce all <app-host-ip>/32 scram-sha-256    # two-host variant only (compose.two-host-db.yml)
host    all            all        all         reject
