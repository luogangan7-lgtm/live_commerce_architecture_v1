# File: deploy/postgres/postgresql.conf
# Purpose: complete server configuration for the single PostgreSQL 18 instance, the only
#   transactional source of truth (inventory, orders, payments, River queues) — AGENTS.md.
#   Parameters not listed keep PostgreSQL defaults.
# Runs as/in: service "postgres" (repo-pinned postgres@sha256:4ef4dbc9…, PG 18.6), UID 999,
#   passed as `-c config_file=/etc/postgresql/postgresql.conf` (bind-mounted read-only).
#   The image entrypoint also passes these args to its socket-only init server.
# Reads env / secrets: none (superuser password comes from POSTGRES_PASSWORD_FILE at initdb).
# Used by: postgres; pg-ops (PITR drill copies archive settings conceptually); watchdog W4/W9.
# Depends on: ${LC_BACKUP_DIR}/wal bind-mounted at /backup/wal (WAL archive target, 0700 999:999).
# Status: DESIGN; verified by smoke S11 (checksums/archive_mode), S30 (archiving), S27 (no PII
#   bind values in logs).
# Change rules: memory settings assume the 3 GiB container limit in compose.yml (§13 sizing);
#   raise both together. max_connections budget: pgxpool default max(4,NumCPU) per pool; the API
#   opens up to 7 pools, workers 1-2 each (~120 worst case on 8 vCPU). Never enable
#   log_parameter_max_length (buyer PII in bind values). idle_in_transaction_session_timeout is
#   deliberately default (untested with River/migrations; watchdog W7 alerts instead).

# --- connections ---------------------------------------------------------------------------
listen_addresses = '*'                      # container-only; the port is never published (single host)
port = 5432
unix_socket_directories = '/var/run/postgresql'   # shared pgsocket volume: migrate / provision / pg-ops
max_connections = 150
superuser_reserved_connections = 5
password_encryption = 'scram-sha-256'

# --- memory (3 GiB container limit) -------------------------------------------------------------
shared_buffers = 768MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 256MB

# --- WAL, checkpoints, archiving (PITR) ----------------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 10min
max_wal_senders = 3                          # pg_basebackup -X stream from pg-ops
archive_mode = on
archive_timeout = 60s                        # bounds local RPO to ~1 min when wal/ is on another disk
# Copy to a .part file, fsync, then atomically rename. Re-archiving an identical, already
# archived segment succeeds (cmp) so a crash between rename and PG's bookkeeping cannot wedge
# the archiver; a *different* existing file still fails loudly (watchdog W4).
archive_command = 'if test -f /backup/wal/%f; then cmp -s %p /backup/wal/%f; else cp %p /backup/wal/%f.part && sync /backup/wal/%f.part && mv /backup/wal/%f.part /backup/wal/%f; fi'

# --- logging (stderr -> Docker json-file driver) -------------------------------------------------
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '     # %a = application_name set in every DSN (service name)
# 'ddl' logs ALTER ROLE ... PASSWORD in cleartext. Every session that sends a password literal must
# first SET log_statement='none', log_min_error_statement='panic', log_min_duration_statement=-1
# (provision-logins.sh; ops/lib.sh ops_alter_superuser_password used by pg-ops.sh rotate-superuser
# and restore-pitr --promote; verified by smoke S41 with a DDL canary).
log_statement = 'ddl'
log_min_duration_statement = 500
log_parameter_max_length = 0                 # never log bind values (buyer PII)
log_parameter_max_length_on_error = 0
log_connections = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
log_checkpoints = on

# --- locale/time ---------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
