# File: deploy/compose.yml
# Purpose: the whole single-host production-shaped stack (deploy-design §3, §8): services,
#   profiles, networks, volumes and file secrets. NON-HA: 架构.md §4.2 says Compose is for
#   dev/repeatable acceptance; running production on it needs owner ADR O1 (blocker B8).
# Runs as/in: `docker compose` on the deploy host, ALWAYS through deploy/scripts/lib.sh
#   lc_compose (adds --project-directory deploy/ and --env-file /etc/live-commerce/compose.env).
# Reads env (interpolation, from compose.env — the only home for cross-service values):
#   COMPOSE_PROJECT_NAME, COMPOSE_PROFILES, IMAGE_TAG (git sha12 of the images),
#   LC_IMAGE_PREFIX, LC_BIND_ADDR/LC_HTTP_PORT/LC_HTTPS_PORT (published edge ports),
#   LC_ADMIN_HOST/LC_STORE_HOST/LC_API_HOST/LC_HOOKS_HOST (public names -> Caddy sites and
#   derived origins), LC_ENV_DIR (per-service knob files), LC_SECRETS_DIR + LC_SECRETS_GID
#   (secret files and the group that may read them), LC_BACKUP_DIR (dumps/base/wal),
#   LC_IDENTITY_ENABLED, LC_OIDC_ISSUER, LC_PASSWORD_LOGIN_ENABLED (+ LC_SMTP_HOST, LC_SMTP_USERNAME, LC_MAIL_FROM,
#   LC_MAIL_DAILY_CAP, LC_BREACH_CHECK), LC_ONBOARDING_ENABLED, LC_ONBOARDING_CURRENCIES,
#   LC_BUYER_ENABLED, LC_BUYER_SESSION_TTL_SECONDS (one value -> api "<N>s", storefront "<N>"),
#   LC_STRIPE_ENABLED (-> api COMMERCE_STRIPE_WEBHOOK_ENABLED and COMMERCE_STRIPE_ENABLED on the worker of the
#   deployed profile) and LC_STRIPE_CHECKOUT_ENABLED (-> api COMMERCE_STRIPE_CHECKOUT_ENABLED only; follows
#   LC_STRIPE_ENABLED when unset; the platform kill switch), LC_STRIPE_LIVE_ENABLED + LC_STRIPE_LIVE_APPROVAL_REF
#   (the LIVE pair -> api and payment-worker-live; stripe-live-enable-v1 LD6/§5.2),
#   LC_CVS_ECPAY_ENABLED (one switch -> api + claims-worker CVS_ECPAY_ENABLED; SANDBOX only,
#   taiwan-cvs-logistics-v1 §12).
# Reads secrets: every row of deploy/secrets.manifest.tsv, mounted at /run/secrets/<name>
#   (Compose non-swarm file secrets = read-only bind mounts that keep host modes 0440
#   root:${LC_SECRETS_GID}); apps receive them only as NAME_FILE paths expanded by lcentry.
# Used by: deploy/scripts/{deploy,pg-ops,smoke,watchdog,collect-diagnostics}.sh, runbooks.
# Depends on: images lc-go/lc-admin/lc-storefront/lc-caddy:${IMAGE_TAG} (build-images.sh),
#   pinned postgres + pause images, deploy/caddy/Caddyfile, deploy/postgres/*.
# Status: DESIGN. Static `config` validated by smoke S03; runtime S07-S43 by `smoke.sh full`.
#   R1 additions (unit deploy-release): claims-worker, Stripe ingress/keyring wiring, K_actor on
#   meta-worker, and the operator one-shots stripe-admin / meta-admin (profile ops).
# Change rules:
#   * `environment:` = fixed WIRING (listeners, derived origins, *_FILE paths, ENABLED=1 of
#     profile-gated workers). env/<svc>.env = per-service KNOBS only; preflight P06 fails if a
#     knob file redefines a wired variable (Compose would silently prefer `environment:`).
#   * Profiles decide what runs: db, app, payments-sandbox, payments-live, meta, claims, ops.
#     `claims` (claims-worker) is the only service that can SEND to Meta users (first private
#     reply of a claim); it stays off until the owner approves real sends (docs/runbooks/deploy.md).
#   * stripe-admin / meta-admin are OPERATOR one-shots (profile ops, `restart: no`): they run only
#     through deploy/scripts/ops-admin.sh, hold the registrar logins that no long-running service
#     mounts, and never share a container with api/admin/storefront/workers.
#   * Never `docker compose down -v` outside smoke (smoke owns its own project + volumes).
#   * edge-netns is recreated only together with its dependents (full `up -d`); recreating it
#     alone strands caddy/api/admin/storefront in a dead network namespace.
#   * Any new external image must be digest-pinned (deploy/scripts/check-pins.sh, smoke S02).

name: ${COMPOSE_PROJECT_NAME:-live-commerce}

# ---------------------------------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------------------------------
x-logging: &logging
  # ~100 MB cap per container; read with `docker compose logs --since 30m <svc>`.
  driver: json-file
  options: { max-size: "20m", max-file: "5", compress: "true" }

x-hardened: &hardened
  # D9 hardening baseline for every long-running container (smoke S25 asserts it).
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true                     # tini as PID 1: signal forwarding + zombie reaping
  logging: *logging
  restart: unless-stopped

x-go: &go
  <<: *hardened
  image: ${LC_IMAGE_PREFIX:-lc}-go:${IMAGE_TAG:?set IMAGE_TAG}
  user: "65532:65532"            # distroless nonroot
  group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]   # may read 0440 root:GID secret files
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
  pids_limit: 128
  stop_grace_period: 30s         # workers: 15 s in-flight drain + 5 s cancel (payment-worker-runtime.md)

x-after-db: &after-db
  # Single host: wait for the one-shot jobs. Two-host app host: `db` is inactive there, so
  # `required: false` makes Compose ignore these and the runbook orders the steps instead.
  migrate: { condition: service_completed_successfully, required: false }
  provision-logins: { condition: service_completed_successfully, required: false }

services:
  # -------------------------------------------------------------------------------------------
  # Edge pod: one network namespace shared by caddy, api, admin, storefront (Kubernetes Pod
  # pattern, D2). Needed because cmd/api refuses a non-loopback LISTEN_ADDR once identity/
  # buyer/meta/studio are on (cmd/api/main.go:35-37) and both Next apps bind 127.0.0.1.
  # -------------------------------------------------------------------------------------------
  edge-netns:
    profiles: [app]
    # pause 3.10.1 (registry.k8s.io, multi-arch index digest resolved 2026-09-28): owns the
    # netns so a caddy restart never tears it down for api/admin/storefront.
    image: registry.k8s.io/pause:3.10.1@sha256:278fb9dbcca9518083ad1e11276933a2e96f23de604a3a08cc3c80002767d24c
    user: "65535:65535"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging
    restart: unless-stopped
    networks: [edge, backend]    # edge = internet egress/ingress; backend = reach postgres
    ports:
      - "${LC_BIND_ADDR:-0.0.0.0}:${LC_HTTP_PORT:-80}:80/tcp"
      - "${LC_BIND_ADDR:-0.0.0.0}:${LC_HTTPS_PORT:-443}:443/tcp"
      - "${LC_BIND_ADDR:-0.0.0.0}:${LC_HTTPS_PORT:-443}:443/udp"   # HTTP/3
    sysctls:
      # Lets non-root Caddy (UID 10001, no capabilities) bind :80/:443. Docker's default is 0
      # already; stated explicitly so a daemon change cannot silently break the edge.
      net.ipv4.ip_unprivileged_port_start: "0"
    cpus: 0.05
    mem_limit: 16m
    pids_limit: 16
    stop_grace_period: 5s

  caddy:
    <<: *hardened
    profiles: [app]
    image: ${LC_IMAGE_PREFIX:-lc}-caddy:${IMAGE_TAG:?set IMAGE_TAG}
    user: "10001:10001"
    network_mode: "service:edge-netns"
    depends_on: [edge-netns]
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/caddy.env"]    # ACME_EMAIL, optional LC_ACME_CA
    environment:
      LC_ADMIN_HOST: ${LC_ADMIN_HOST:?set LC_ADMIN_HOST}
      LC_STORE_HOST: ${LC_STORE_HOST:?set LC_STORE_HOST}
      LC_API_HOST: ${LC_API_HOST:?set LC_API_HOST}
      LC_HOOKS_HOST: ${LC_HOOKS_HOST:?set LC_HOOKS_HOST}
    volumes:
      - caddy-data:/data          # certificates + ACME account key: back this up with the host
      - caddy-config:/config
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    tmpfs:
      - "/run/caddy:uid=10001,gid=10001,mode=0700,size=1m"   # admin unix socket
      - "/tmp:rw,noexec,nosuid,nodev,size=16m"
    # Health: image HEALTHCHECK (wget http://127.0.0.1:2080/healthz).
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 256
    stop_grace_period: 15s

  api:
    <<: *go
    profiles: [app]
    command: ["/app/bin/api"]
    network_mode: "service:edge-netns"
    depends_on:
      edge-netns: { condition: service_started }
      <<: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/api.env"]
    environment:
      LISTEN_ADDR: "127.0.0.1:8080"                     # must be literal loopback (C1)
      GOMEMLIMIT: 410MiB                                # ~80 % of mem_limit
      COMMERCE_FIXTURE_ENABLED: "0"                     # fixture mode is test-only
      COMMERCE_IDENTITY_ENABLED: ${LC_IDENTITY_ENABLED:-0}
      COMMERCE_OIDC_ISSUER: ${LC_OIDC_ISSUER:-}
      # Merchant password login (merchant-password-auth-v1 §5). Default off; OIDC stays required while it is off.
      COMMERCE_PASSWORD_LOGIN_ENABLED: ${LC_PASSWORD_LOGIN_ENABLED:-0}
      COMMERCE_SMTP_HOST: ${LC_SMTP_HOST:-}
      COMMERCE_SMTP_USERNAME: ${LC_SMTP_USERNAME:-}
      COMMERCE_MAIL_FROM: ${LC_MAIL_FROM:-}
      COMMERCE_MAIL_DAILY_CAP: ${LC_MAIL_DAILY_CAP:-200}
      COMMERCE_BREACH_CHECK: ${LC_BREACH_CHECK:-hibp}
      COMMERCE_ONBOARDING_ENABLED: ${LC_ONBOARDING_ENABLED:-0}
      COMMERCE_ONBOARDING_CURRENCIES: ${LC_ONBOARDING_CURRENCIES:-}
      COMMERCE_BUYER_ENABLED: ${LC_BUYER_ENABLED:-0}
      COMMERCE_BUYER_SESSION_TTL: ${LC_BUYER_SESSION_TTL_SECONDS:-2592000}s   # Go duration
      # OIDC redirect = <origin>/api/auth/callback (cmd/api/identity.go:59).
      COMMERCE_PUBLIC_ORIGIN: https://${LC_ADMIN_HOST:?set LC_ADMIN_HOST}
      # PAYUNi callbacks must be https, dotted, port 443 (payuni/client.go:174-186).
      COMMERCE_PAYMENT_RETURN_URL: https://${LC_STORE_HOST:?set LC_STORE_HOST}/payment/return
      # Reserved: no notify receiver exists yet; Caddy answers 404 there (blocker B4).
      COMMERCE_PAYMENT_NOTIFY_URL: https://${LC_HOOKS_HOST:?set LC_HOOKS_HOST}/payuni/notify
      # DSNs (one LOGIN per authority, deploy/postgres/logins.tsv) and keys, as file paths.
      DATABASE_URL_FILE: /run/secrets/dsn_lc_api_runtime
      COMMERCE_IDENTITY_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_identity
      COMMERCE_BUYER_ISSUER_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_buyer_issuer
      COMMERCE_BUYER_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_buyer
      COMMERCE_CHECKOUT_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_checkout
      COMMERCE_HOSTED_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_hosted
      COMMERCE_META_INGRESS_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_meta_ingress
      COMMERCE_BFF_KEY_FILE: /run/secrets/commerce_bff_key
      COMMERCE_BUYER_BFF_KEY_FILE: /run/secrets/commerce_buyer_bff_key
      # Manual-label HMAC key of keyword claims (cmd/api/claims.go; read only with COMMERCE_CLAIMS_ENABLED=1).
      COMMERCE_CLAIMS_LABEL_KEY_FILE: /run/secrets/commerce_claims_label_key
      COMMERCE_OIDC_CLIENT_SECRET_FILE: /run/secrets/commerce_oidc_client_secret
      # lcentry expands these to COMMERCE_AUTH_PEPPER / COMMERCE_SMTP_PASSWORD (cmd/api/identity.go secretEnv).
      COMMERCE_AUTH_PEPPER_FILE: /run/secrets/commerce_auth_pepper
      COMMERCE_SMTP_PASSWORD_FILE: /run/secrets/commerce_smtp_password
      COMMERCE_ACCOUNT_KEYS_JSON_FILE: /run/secrets/commerce_account_keys_json
      COMMERCE_ACCOUNT_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_account_active_key_id
      COMMERCE_ACCOUNT_REPLAY_KEY_FILE: /run/secrets/commerce_account_replay_key
      COMMERCE_META_PAYLOAD_KEYS_JSON_FILE: /run/secrets/commerce_meta_payload_keys_json
      COMMERCE_META_PAYLOAD_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_meta_payload_active_key_id
      COMMERCE_META_APPS_JSON_FILE: /run/secrets/commerce_meta_apps_json
      # Stripe (stripe-psp-v1 §0.2/§12, stripe-live-enable-v1 LD6): TWO switches (LD6). The webhook route follows
      # LC_STRIPE_ENABLED; the buyer checkout flag has its own source LC_STRIPE_CHECKOUT_ENABLED (defaults to
      # LC_STRIPE_ENABLED) so the platform can stop new checkouts while webhook + worker keep reconciling.
      # LIVE needs the pair below (both or neither; preflight P06). The API never reads STRIPE_* (API keys live
      # sealed in PG); webhook signing keys use the SEPARATE COMMERCE_STRIPE_WEBHOOK_* keyring
      # (cmd/api/stripe_webhook.go remapSigningNames).
      COMMERCE_STRIPE_WEBHOOK_ENABLED: ${LC_STRIPE_ENABLED:-0}
      COMMERCE_STRIPE_CHECKOUT_ENABLED: ${LC_STRIPE_CHECKOUT_ENABLED:-${LC_STRIPE_ENABLED:-0}}
      COMMERCE_STRIPE_LIVE_ENABLED: ${LC_STRIPE_LIVE_ENABLED:-0}
      COMMERCE_STRIPE_LIVE_APPROVAL_REF: ${LC_STRIPE_LIVE_APPROVAL_REF:-}
      COMMERCE_STRIPE_INGRESS_DATABASE_URL_FILE: /run/secrets/dsn_lc_api_stripe_ingress
      COMMERCE_STRIPE_WEBHOOK_KEYS_JSON_FILE: /run/secrets/commerce_stripe_webhook_keys_json
      COMMERCE_STRIPE_WEBHOOK_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_stripe_webhook_active_key_id
      COMMERCE_STRIPE_WEBHOOK_REPLAY_KEY_FILE: /run/secrets/commerce_stripe_webhook_replay_key
      # meta-ads-v1 G3: the api seals merchant tokens with the HPKE PUBLIC ring only; it never mounts the
      # private ring (only ads-worker does). Read only when api.env sets COMMERCE_META_ADS_APP_ID.
      COMMERCE_META_ADS_APP_SECRET_FILE: /run/secrets/commerce_meta_ads_app_secret
      COMMERCE_META_ADS_TOKEN_HPKE_PUBLIC_KEYS_JSON_FILE: /run/secrets/commerce_meta_ads_hpke_public_keys_json
      COMMERCE_META_ADS_TOKEN_HPKE_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_meta_ads_hpke_active_key_id
      # Platform billing (customers-billing-v1 T17, billing-core B3): LC_BILLING_ENABLED unset = billing off
      # (LoadConfig treats "" as disabled and rejects "0", so no :-0 default). The webhook reuses the
      # commerce_stripe_ingress login above (COMMERCE_STRIPE_INGRESS_DATABASE_URL). SANDBOX keys only (BD8).
      LC_BILLING_ENABLED: ${LC_BILLING_ENABLED:-}
      LC_BILLING_PRICE_IDS: ${LC_BILLING_PRICE_IDS:-}
      LC_BILLING_RETURN_ORIGIN: https://${LC_ADMIN_HOST:?set LC_ADMIN_HOST}
      LC_PLATFORM_STRIPE_SECRET_KEY_FILE: /run/secrets/commerce_platform_stripe_secret_key
      LC_PLATFORM_STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/commerce_platform_stripe_webhook_secret
      # taiwan-cvs-logistics-v1 §12: hooks origin for both ServerReplyURLs (map return, status), the ECPay
      # switch (one LC_CVS_ECPAY_ENABLED for api + claims-worker), and the keyring the API-side loaders
      # decrypt with (status MAC, print form, probe). The ECPay environment = api.env COMMERCE_PAYMENT_PROFILE.
      COMMERCE_CVS_HOOKS_ORIGIN: https://${LC_HOOKS_HOST:?set LC_HOOKS_HOST}
      CVS_ECPAY_ENABLED: ${LC_CVS_ECPAY_ENABLED:-0}
      ECPAY_LOGISTICS_KEYRING_FILE: /run/secrets/ecpay_logistics_keyring
    secrets:
      - ecpay_logistics_keyring
      - dsn_lc_api_runtime
      - dsn_lc_api_identity
      - dsn_lc_api_buyer_issuer
      - dsn_lc_api_buyer
      - dsn_lc_api_checkout
      - dsn_lc_api_hosted
      - dsn_lc_api_meta_ingress
      - dsn_lc_api_stripe_ingress
      - commerce_stripe_webhook_keys_json
      - commerce_stripe_webhook_active_key_id
      - commerce_stripe_webhook_replay_key
      - commerce_platform_stripe_secret_key
      - commerce_platform_stripe_webhook_secret
      - commerce_bff_key
      - commerce_buyer_bff_key
      - commerce_claims_label_key
      - commerce_oidc_client_secret
      - commerce_auth_pepper
      - commerce_smtp_password
      - commerce_account_keys_json
      - commerce_account_active_key_id
      - commerce_account_replay_key
      - commerce_meta_payload_keys_json
      - commerce_meta_payload_active_key_id
      - commerce_meta_apps_json
      - commerce_meta_ads_app_secret
      - commerce_meta_ads_hpke_public_keys_json
      - commerce_meta_ads_hpke_active_key_id
    healthcheck:
      # /readyz pings the runtime pool (platform.go:543-555); lcentry is the only HTTP client in distroless.
      test: ["CMD", "/app/bin/lcentry", "probe", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 30s
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 40s       # API drains for 10 s on SIGTERM (cmd/api/main.go) + up to 25 s for in-flight auth mail (Passwords.Close, A12)

  admin:
    <<: *hardened
    profiles: [app]
    image: ${LC_IMAGE_PREFIX:-lc}-admin:${IMAGE_TAG:?set IMAGE_TAG}
    user: "1000:1000"
    group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]
    network_mode: "service:edge-netns"
    depends_on:
      edge-netns: { condition: service_started }
      <<: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/admin.env"]    # NODE_OPTIONS only
    environment:
      # Listener of the Next standalone server (server.js reads HOSTNAME/PORT; Docker would set
      # HOSTNAME=<container id>). MUST be the literal name "localhost", not "127.0.0.1": Next builds
      # its request origin from this value, while NextURL (request.nextUrl, used by
      # apps/admin/proxy.ts for the locale redirect) canonicalises 127.x/[::1] to "localhost".
      # With 127.0.0.1 the two origins differ, Next cannot relativise the redirect and "/" answered
      # "307 Location: https://localhost:3100/zh-CN" through Caddy (VERIFIED_LOCAL F2, smoke
      # S21/S34). With "localhost" Next sends "Location: /zh-CN". It still binds loopback only:
      # admin.Dockerfile starts node with --dns-result-order=ipv4first, so "localhost" resolves to
      # 127.0.0.1, which Caddy (reverse_proxy 127.0.0.1:3100) and the healthcheck below dial.
      HOSTNAME: "localhost"
      PORT: "3100"
      COMMERCE_FIXTURE_ENABLED: "0"
      COMMERCE_IDENTITY_ENABLED: ${LC_IDENTITY_ENABLED:-0}
      COMMERCE_OIDC_ISSUER: ${LC_OIDC_ISSUER:-}
      COMMERCE_PASSWORD_LOGIN_ENABLED: ${LC_PASSWORD_LOGIN_ENABLED:-0}   # mirrors api (auth-ui BFF config)
      COMMERCE_ONBOARDING_ENABLED: ${LC_ONBOARDING_ENABLED:-0}
      COMMERCE_ONBOARDING_CURRENCIES: ${LC_ONBOARDING_CURRENCIES:-}
      COMMERCE_PUBLIC_ORIGIN: https://${LC_ADMIN_HOST:?set LC_ADMIN_HOST}   # __Host- cookies need HTTPS
      COMMERCE_API_ORIGIN: "http://127.0.0.1:8080"                          # server-to-server, loopback
      COMMERCE_BFF_KEY_FILE: /run/secrets/commerce_bff_key                  # same file as api's
    secrets: [commerce_bff_key]
    tmpfs:
      - "/app/apps/admin/.next/cache:uid=1000,gid=1000,mode=0700,size=64m"   # Next runtime cache
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    healthcheck:
      # No /healthz route yet (REQUIRES_INTEGRATOR I2); any status < 500 means the server is up.
      test: ["CMD", "/usr/local/bin/lcentry", "probe", "-max-status", "499", "http://127.0.0.1:3100/"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 256
    stop_grace_period: 15s

  storefront:
    <<: *hardened
    profiles: [app]
    image: ${LC_IMAGE_PREFIX:-lc}-storefront:${IMAGE_TAG:?set IMAGE_TAG}
    user: "1000:1000"
    group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]
    network_mode: "service:edge-netns"
    depends_on:
      edge-netns: { condition: service_started }
      <<: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/storefront.env"]   # NODE_OPTIONS only
    environment:
      COMMERCE_BUYER_WEB_ENABLED: ${LC_BUYER_ENABLED:-0}
      COMMERCE_BUYER_API_ORIGIN: "http://127.0.0.1:8080"
      COMMERCE_BUYER_SESSION_TTL: ${LC_BUYER_SESSION_TTL_SECONDS:-2592000}   # integer seconds
      COMMERCE_BUYER_BFF_KEY_FILE: /run/secrets/commerce_buyer_bff_key       # same file as api's
      COMMERCE_BUYER_COOKIE_KEY_FILE: /run/secrets/commerce_buyer_cookie_key
    secrets: [commerce_buyer_bff_key, commerce_buyer_cookie_key]
    tmpfs:
      - "/app/apps/storefront/.next/cache:uid=1000,gid=1000,mode=0700,size=64m"
      - "/tmp:rw,noexec,nosuid,nodev,size=32m"
    healthcheck:
      test: ["CMD", "/usr/local/bin/lcentry", "probe", "-max-status", "499", "http://127.0.0.1:3200/"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 30s
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 15s

  # -------------------------------------------------------------------------------------------
  # Workers: no HTTP port, no healthcheck (C4). They log fixed ready/error tokens
  # (*_worker_ready, *_invalid_config, *_database*, *_start_failed) watched by smoke/watchdog.
  # -------------------------------------------------------------------------------------------
  expiry-worker:
    <<: *go
    profiles: [app]
    command: ["/app/bin/expiry-worker"]
    networks: [backend]          # DB only, no internet
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/expiry-worker.env"]   # concurrency
    environment:
      COMMERCE_EXPIRY_WORKER_ENABLED: "1"
      COMMERCE_EXPIRY_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_expiry_worker
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_expiry_worker]
    cpus: 0.5
    mem_limit: 256m

  payment-worker-sandbox:
    <<: *go
    profiles: [payments-sandbox]
    command: ["/app/bin/payment-worker"]
    networks: [backend, egress]  # egress: PAYUNi sandbox + api.stripe.com HTTPS (endpoints are code constants)
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/payment-worker.env"]
    environment:
      COMMERCE_PAYMENT_WORKER_ENABLED: "1"
      COMMERCE_PAYMENT_WORKER_PROFILE: SANDBOX   # one process per profile (disjoint River queues)
      # Stripe dispatch + refund worker on the SANDBOX queue (kept in a LIVE deployment only to drain SANDBOX work,
      # stripe-live-enable-v1 LD1). payment-worker-live gets the same switch plus the LIVE pair below.
      COMMERCE_STRIPE_ENABLED: ${LC_STRIPE_ENABLED:-0}
      COMMERCE_PAYMENT_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_payment_sandbox
      COMMERCE_ACCOUNT_KEYS_JSON_FILE: /run/secrets/commerce_account_keys_json
      COMMERCE_ACCOUNT_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_account_active_key_id
      COMMERCE_ACCOUNT_REPLAY_KEY_FILE: /run/secrets/commerce_account_replay_key
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_payment_sandbox, commerce_account_keys_json, commerce_account_active_key_id, commerce_account_replay_key]
    cpus: 0.5
    mem_limit: 256m

  payment-worker-live:
    # REAL MONEY. Enable profile payments-live only with owner approval + PAYUNi qualification (B3).
    <<: *go
    profiles: [payments-live]
    command: ["/app/bin/payment-worker"]
    networks: [backend, egress]
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/payment-worker.env"]
    environment:
      COMMERCE_PAYMENT_WORKER_ENABLED: "1"
      COMMERCE_PAYMENT_WORKER_PROFILE: LIVE
      # stripe-live-enable-v1 §5.2: Stripe dispatch + refunds on the LIVE queue only with the LIVE pair (both or
      # neither; cmd/payment-worker refuses a lone half). Stopping this worker is NOT a kill switch (LD6).
      COMMERCE_STRIPE_ENABLED: ${LC_STRIPE_ENABLED:-0}
      COMMERCE_STRIPE_LIVE_ENABLED: ${LC_STRIPE_LIVE_ENABLED:-0}
      COMMERCE_STRIPE_LIVE_APPROVAL_REF: ${LC_STRIPE_LIVE_APPROVAL_REF:-}
      COMMERCE_PAYMENT_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_payment_live
      COMMERCE_ACCOUNT_KEYS_JSON_FILE: /run/secrets/commerce_account_keys_json
      COMMERCE_ACCOUNT_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_account_active_key_id
      COMMERCE_ACCOUNT_REPLAY_KEY_FILE: /run/secrets/commerce_account_replay_key
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_payment_live, commerce_account_keys_json, commerce_account_active_key_id, commerce_account_replay_key]
    cpus: 0.5
    mem_limit: 256m

  meta-worker:
    # Accepted local runtime only; not customer-activated (meta-runtime gate, blocker B6).
    <<: *go
    profiles: [meta]
    command: ["/app/bin/meta-worker"]
    networks: [backend]
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/meta-worker.env"]
    environment:
      COMMERCE_META_WORKER_ENABLED: "1"
      COMMERCE_META_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_meta_worker
      COMMERCE_META_CONSUMER_DATABASE_URL_FILE: /run/secrets/dsn_lc_meta_consumer
      COMMERCE_META_PAYLOAD_KEYS_JSON_FILE: /run/secrets/commerce_meta_payload_keys_json
      COMMERCE_META_PAYLOAD_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_meta_payload_active_key_id
      # K_actor (meta-claims-intake-v1 §3): turns comment senders into keyed claim actors. Only this
      # process loads it; without it claim staging is off and comments never become claims.
      COMMERCE_CLAIMS_ACTOR_KEY_FILE: /run/secrets/commerce_claims_actor_key
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_meta_worker, dsn_lc_meta_consumer, commerce_meta_payload_keys_json, commerce_meta_payload_active_key_id, commerce_claims_actor_key]
    cpus: 0.5
    mem_limit: 256m

  claims-worker:
    # T10c (meta-claims-intake-v1 §5.3): claims intake poller + the ONLY sender of Meta private replies
    # (metareply routes -> graph.facebook.com). Off until the owner approves real sends (profile claims).
    <<: *go
    profiles: [claims]
    command: ["/app/bin/claims-worker"]
    networks: [backend, egress]  # egress: graph.facebook.com (the Graph host is a code constant)
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/claims-worker.env"]   # Graph version (U5), auth-header mode
    environment:
      COMMERCE_CLAIMS_WORKER_ENABLED: "1"
      # Two logins, two authorities, one database: intake (claims apply + reply planning) and the
      # main-schema external_operation_v1 dispatcher (commerce_worker).
      COMMERCE_CLAIMS_INTAKE_DATABASE_URL_FILE: /run/secrets/dsn_lc_claims_intake
      COMMERCE_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_claims_worker
      # U08 hourly retention purge on its own login (lc_retention_job); the operator login is never deployed.
      COMMERCE_RETENTION_JOB_DATABASE_URL_FILE: /run/secrets/dsn_lc_retention_job
      COMMERCE_CLAIMS_REPLY_LINK_KEY_FILE: /run/secrets/commerce_claims_reply_link_key
      COMMERCE_META_PAGE_TOKEN_KEYS_JSON_FILE: /run/secrets/commerce_meta_page_token_keys_json
      COMMERCE_META_PAGE_TOKEN_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_meta_page_token_active_key_id
      # taiwan-cvs-logistics-v1 §12: ECPay create/query route (cmd/claims-worker registers it iff CVS_ECPAY_ENABLED=1).
      # ponytail: ECPay is SANDBOX-only in this release (preflight P06: LC_CVS_ECPAY_ENABLED=1 requires the api's
      # COMMERCE_PAYMENT_PROFILE=SANDBOX), so the worker's profile and LIVE-create switch are fixed here; a LIVE
      # ECPay deployment is an owner-approved change of these two lines together with the api profile (§0.3 P4).
      CVS_ECPAY_ENABLED: ${LC_CVS_ECPAY_ENABLED:-0}
      CVS_ECPAY_LIVE_CREATE: "0"
      COMMERCE_CVS_HOOKS_ORIGIN: https://${LC_HOOKS_HOST:?set LC_HOOKS_HOST}
      COMMERCE_PAYMENT_PROFILE: SANDBOX
      ECPAY_LOGISTICS_KEYRING_FILE: /run/secrets/ecpay_logistics_keyring
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_claims_intake, dsn_lc_claims_worker, dsn_lc_retention_job, commerce_claims_reply_link_key, commerce_meta_page_token_keys_json, commerce_meta_page_token_active_key_id, ecpay_logistics_keyring]
    cpus: 0.5
    mem_limit: 256m

  ads-worker:
    # ads-graph (meta-ads-v1 §6): the ONLY process that holds the HPKE private key and can open a BISU
    # token; the only Meta ad-account writer. Queue "ads" only (never "default"). Off until ads are
    # enabled for a store (profile ads); ad spend stays gated by ads.Checker (approval, allowance, AD9).
    <<: *go
    profiles: [ads]
    command: ["/app/bin/ads-worker"]
    networks: [backend, egress]  # egress: graph.facebook.com (the Graph host is a code constant)
    depends_on: *after-db
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/ads-worker.env"]   # COMMERCE_META_ADS_GRAPH_VERSION, COMMERCE_META_ADS_PARTNER_AGENT
    environment:
      COMMERCE_ADS_WORKER_DATABASE_URL_FILE: /run/secrets/dsn_lc_ads_worker     # commerce_worker login (logins.tsv lc_ads_worker)
      COMMERCE_META_ADS_TOKEN_HPKE_PRIVATE_KEYS_FILE: /run/secrets/commerce_meta_ads_hpke_private_keys_json
      COMMERCE_CAPI_EXTERNAL_ID_KEY_FILE: /run/secrets/commerce_capi_external_id_key   # C3 (ads-capi), ads-worker only
      GOMEMLIMIT: 200MiB
    secrets: [dsn_lc_ads_worker, commerce_meta_ads_hpke_private_keys_json, commerce_capi_external_id_key]
    cpus: 0.5
    mem_limit: 256m

  # media-worker is intentionally absent: every LiveKit project is hard-wired to MOCK with a
  # loopback dial address (internal/integrations/livekit/worker_env.go:174). See
  # deploy/env/media-worker.env.example for its (reference-only) contract. Blocker B5.

  # -------------------------------------------------------------------------------------------
  # Operator one-shots (profile ops). Run ONLY via deploy/scripts/ops-admin.sh, which forwards the
  # operator's own inputs (STRIPE_SECRET_KEY, META_PAGE_ACCESS_TOKEN, ...) from a no-echo prompt or
  # the caller's environment and never writes them to a file, argv or this repo. Never started by
  # `up -d`; never inside api/admin/storefront/worker containers (they hold neither the registrar
  # logins nor these inputs).
  # -------------------------------------------------------------------------------------------
  stripe-admin:
    # stripe-psp-v1 §13: register/rotate/webhook/qualify/method. Dials api.stripe.com (register,
    # rotate, SANDBOX qualify) and refuses LIVE in code.
    <<: *go
    profiles: [ops]
    command: ["/app/bin/stripe-admin"]
    restart: "no"
    networks: [backend, egress]
    environment:
      COMMERCE_STRIPE_REGISTRAR_DATABASE_URL_FILE: /run/secrets/dsn_lc_stripe_registrar
      # API-key keyring seals register/rotate; the SEPARATE signing keyring seals `webhook`.
      COMMERCE_ACCOUNT_KEYS_JSON_FILE: /run/secrets/commerce_account_keys_json
      COMMERCE_ACCOUNT_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_account_active_key_id
      COMMERCE_ACCOUNT_REPLAY_KEY_FILE: /run/secrets/commerce_account_replay_key
      COMMERCE_STRIPE_WEBHOOK_KEYS_JSON_FILE: /run/secrets/commerce_stripe_webhook_keys_json
      COMMERCE_STRIPE_WEBHOOK_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_stripe_webhook_active_key_id
      COMMERCE_STRIPE_WEBHOOK_REPLAY_KEY_FILE: /run/secrets/commerce_stripe_webhook_replay_key
    secrets: [dsn_lc_stripe_registrar, commerce_account_keys_json, commerce_account_active_key_id, commerce_account_replay_key,
      commerce_stripe_webhook_keys_json, commerce_stripe_webhook_active_key_id, commerce_stripe_webhook_replay_key]
    cpus: 0.5
    mem_limit: 128m
    stop_grace_period: 10s

  meta-admin:
    # meta-claims-intake-v1 §7: `page-token` seals a Meta Page access token under the Page-token
    # keyring and registers it through integration.register_meta_page_token. Database only.
    <<: *go
    profiles: [ops]
    command: ["/app/bin/meta-admin"]
    restart: "no"
    networks: [backend]
    environment:
      COMMERCE_META_REGISTRAR_DATABASE_URL_FILE: /run/secrets/dsn_lc_meta_registrar
      COMMERCE_META_PAGE_TOKEN_KEYS_JSON_FILE: /run/secrets/commerce_meta_page_token_keys_json
      COMMERCE_META_PAGE_TOKEN_ACTIVE_KEY_ID_FILE: /run/secrets/commerce_meta_page_token_active_key_id
    secrets: [dsn_lc_meta_registrar, commerce_meta_page_token_keys_json, commerce_meta_page_token_active_key_id]
    cpus: 0.5
    mem_limit: 128m
    stop_grace_period: 10s

  # -------------------------------------------------------------------------------------------
  # Database: postgres + one-shot migrate/provision jobs + on-demand pg-ops.
  # -------------------------------------------------------------------------------------------
  postgres:
    <<: *hardened
    profiles: [db]
    # Same pin as scripts/dev/test-local.sh (PG 18.6, Debian 13): tests and prod on one digest.
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    user: "999:999"              # non-root from the start: the entrypoint skips chown/gosu
    group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "hba_file=/etc/postgresql/pg_hba.conf"]
    networks: [backend]          # port never published on a single host
    env_file: ["${LC_ENV_DIR:?set LC_ENV_DIR}/postgres.env"]   # TZ only
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: live_commerce                        # fixed: pg_hba.conf names it literally
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
      PGDATA: /var/lib/postgresql/18/docker
      POSTGRES_INITDB_ARGS: "--data-checksums"          # PG 18 default; explicit for S11
    secrets: [pg_superuser_password]
    volumes:
      - pgdata:/var/lib/postgresql
      - pgsocket:/var/run/postgresql                    # shared with migrate/provision/pg-ops
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ${LC_BACKUP_DIR:?set LC_BACKUP_DIR}/wal:/backup/wal   # archive_command target
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=64m"]
    shm_size: 512m
    healthcheck:
      # Socket ping AND postmaster.pid line 6 (listen address) non-empty: the image's init-time
      # server listens on the socket only, so a bare socket ping would pass before initdb/
      # CREATE DATABASE finish (the race noted in scripts/dev/test-local.sh).
      test: ["CMD-SHELL", "pg_isready -q -h /var/run/postgresql -U postgres -d live_commerce && [ -n \"$$(sed -n 6p \"$$PGDATA/postmaster.pid\" 2>/dev/null)\" ]"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    cpus: 2.0
    mem_limit: 3g
    pids_limit: 512
    stop_grace_period: 60s

  migrate:
    # One-shot: applies embedded, checksummed, forward-only migrations (cmd/migrate, I1).
    <<: *go
    profiles: [db]
    command: ["/app/bin/migrate"]
    restart: "no"
    network_mode: none           # superuser over the unix socket only; no network at all
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      COMMERCE_MIGRATE_DATABASE_URL_FILE: /run/secrets/dsn_migrate_owner
    secrets: [dsn_migrate_owner]
    volumes: ["pgsocket:/var/run/postgresql"]
    cpus: 1.0
    mem_limit: 512m

  provision-logins:
    # One-shot: idempotent LOGIN create/alter/grant + verification + readiness gate.
    <<: *hardened
    profiles: [db]
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    user: "999:999"
    group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]
    entrypoint: ["bash", "/provision/provision-logins.sh"]
    restart: "no"
    networks: [backend]          # TCP auth check of every login, exactly like the services
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      LC_PG_HOST: postgres
      PGAPPNAME: lc-provision-logins
      # 1 = also require live.media_plan_ready() (only once Studio/media become deployable).
      LC_REQUIRE_MEDIA_GATE: ${LC_REQUIRE_MEDIA_GATE:-0}
    secrets:
      - pg_superuser_password
      - pw_lc_api_runtime
      - pw_lc_api_identity
      - pw_lc_api_buyer_issuer
      - pw_lc_api_buyer
      - pw_lc_api_checkout
      - pw_lc_api_hosted
      - pw_lc_api_meta_ingress
      - pw_lc_expiry_worker
      - pw_lc_payment_sandbox
      - pw_lc_payment_live
      - pw_lc_meta_worker
      - pw_lc_meta_consumer
      - pw_lc_api_stripe_ingress
      - pw_lc_claims_intake
      - pw_lc_claims_worker
      - pw_lc_retention_job
      - pw_lc_ads_worker
      - pw_lc_stripe_registrar
      - pw_lc_meta_registrar
    volumes:
      - pgsocket:/var/run/postgresql
      - ./postgres/provision-logins.sh:/provision/provision-logins.sh:ro
      - ./postgres/logins.tsv:/provision/logins.tsv:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16m"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 10s

  pg-ops:
    # On demand via deploy/scripts/pg-ops.sh: backup / basebackup / restore-dump / restore-pitr.
    <<: *hardened
    profiles: [ops]
    image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    user: "999:999"
    group_add: ["${LC_SECRETS_GID:?set LC_SECRETS_GID}"]
    entrypoint: ["bash"]
    restart: "no"
    network_mode: none           # socket only; never reaches the network
    secrets: [pg_superuser_password]
    volumes:
      - pgsocket:/var/run/postgresql
      - ${LC_BACKUP_DIR:?set LC_BACKUP_DIR}:/backup     # dumps/ base/ wal/ (0700 999:999)
      - ./postgres/ops:/ops:ro
      # PITR scratch cluster. Mounted at the image's postgres-owned /var/lib/postgresql so the
      # fresh volume inherits UID 999 ownership. This is NOT pgdata: pg-ops never mounts pgdata.
      - pitr-scratch:/var/lib/postgresql
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=256m"]
    shm_size: 256m
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 256
    stop_grace_period: 60s

networks:
  edge: {}                        # internet in/out for the edge pod (Caddy, OIDC discovery/JWKS)
  egress: {}                      # payment workers only (PAYUNi)
  backend:
    internal: true                # postgres + DB clients; no internet

volumes:
  pgdata: {}
  pgsocket: {}
  caddy-data: {}
  caddy-config: {}
  pitr-scratch: {}

